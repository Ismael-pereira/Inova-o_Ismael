<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
</head>
<body>

    <p id="contador"></p>
    <ul id="lista"></ul>
    <input id="novo" placeholder="Nova tarefa">
    <button id="add">Adicionar</button>

    <script>
        let tarefas = [
            { id: 1, texto: "Acordar", feita: false },
            { id: 2, texto: "Ir para escola", feita: true }
        ];

        function desenhar() {
            const ul = document.getElementById("lista");
            ul.innerHTML = ""; 

            for (const t of tarefas) {
                const li = document.createElement("li");
                li.textContent = t.texto + (t.feita ? " (feita)" : "");
                ul.appendChild(li);
            }

            document.getElementById("contador").textContent = tarefas.length + " tarefas";
        }

        document.getElementById("add").addEventListener("click", () => {
            const input = document.getElementById("novo");
            
            if (input.value.trim() === "") return;

            tarefas.push({ id: Date.now(), texto: input.value, feita: false });
            input.value = ""; 
            desenhar(); 
        });

        desenhar();
    </script>
    
</body>
</html>
